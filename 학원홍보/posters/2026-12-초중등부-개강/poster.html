<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>T&BEDU 초·중등부 대규모 개강</title>
<style>
  /* ───────── 문구는 아래 <body> 안에서 바로 고치면 됩니다 ─────────
     크기: poster.html?size=insta (1080×1350) / ?size=a4 (1080×1527, 인쇄 시 2480×3508로 렌더) */
  :root{
    --bg-0:#04051a; --bg-1:#0b0d33; --violet:#9b6bff; --violet-hi:#c9a8ff;
    --blue:#5b8cff; --blue-hi:#8fd0ff; --ink:#f3f1ff; --ink-dim:#c4c3e6;
    --card:rgba(30,28,84,.55); --card-line:rgba(155,130,255,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg-0)}
  body{width:1080px;height:1350px;overflow:hidden;position:relative;
    font-family:'Noto Sans KR','Malgun Gothic',sans-serif;color:var(--ink);
    -webkit-font-smoothing:antialiased;word-break:keep-all}
  body.a4{height:1528px}

  /* ── 배경 ── */
  .bg{position:absolute;inset:0;z-index:0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 30%, rgba(98,60,220,.55), transparent 70%),
      radial-gradient(ellipse 45% 35% at 85% 18%, rgba(40,90,255,.35), transparent 70%),
      radial-gradient(ellipse 50% 40% at 10% 55%, rgba(120,40,200,.30), transparent 70%),
      linear-gradient(180deg,var(--bg-1) 0%, var(--bg-0) 70%);}
  .streak{position:absolute;height:2px;border-radius:2px;filter:blur(.6px);
    background:linear-gradient(90deg,transparent,rgba(170,190,255,.85),transparent)}
  .star{position:absolute;border-radius:50%;background:#dfe6ff;box-shadow:0 0 6px #b9c8ff}
  .sparkle{position:absolute;width:44px;height:44px;filter:drop-shadow(0 0 8px #a9c4ff)}

  /* ── 빛나는 고리 ── */
  .title{position:relative}
  .halo{position:absolute;left:50%;top:50%;width:var(--halo,590px);height:var(--halo,590px);
    transform:translate(-50%,-50%);z-index:-1;pointer-events:none}
  .halo .ring{position:absolute;inset:0;border-radius:50%}
  .halo .r1{border:3px solid rgba(190,160,255,.75);
    box-shadow:0 0 40px rgba(150,110,255,.7),inset 0 0 50px rgba(150,110,255,.45)}
  .halo .r2{inset:-26px;border:1.5px solid rgba(140,170,255,.35);transform:rotate(-12deg) scaleY(.94)}
  .halo .r3{inset:30px;border:1px solid rgba(200,170,255,.25)}
  .halo .arc{inset:-6px;
    background:conic-gradient(from 200deg,transparent 0deg,rgba(255,255,255,.95) 40deg,rgba(170,140,255,.6) 80deg,transparent 140deg,
      transparent 230deg,rgba(130,170,255,.8) 280deg,transparent 330deg);
    -webkit-mask:radial-gradient(circle,transparent 61.5%,#000 62.5%,#000 64%,transparent 66%);
            mask:radial-gradient(circle,transparent 61.5%,#000 62.5%,#000 64%,transparent 66%);
    filter:blur(1.5px)}
  .halo .glow{inset:120px;background:radial-gradient(circle,rgba(120,90,255,.35),transparent 70%);filter:blur(20px)}

  /* ── 본문 ── */
  .wrap{position:relative;z-index:2;isolation:isolate;height:100%;display:flex;flex-direction:column;padding:0 72px}
  header{position:relative;z-index:2;display:flex;align-items:center;gap:14px;padding-top:52px}
  header img{width:58px;height:58px}
  header .name{font-weight:800;font-size:34px;letter-spacing:.5px}

  .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding-bottom:var(--hero-pad,10px)}
  .eyebrow{font-weight:900;font-style:italic;font-size:50px;letter-spacing:-1px;
    color:#e9edff;text-shadow:0 0 18px rgba(140,170,255,.8);margin-bottom:6px}
  .headline{font-weight:900;line-height:1.02;letter-spacing:-4px}
  .headline span{display:block;font-size:var(--h-size,150px);
    background:linear-gradient(180deg,var(--violet-hi) 0%,var(--violet) 55%,var(--blue) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 26px rgba(130,100,255,.55))}
  .headline .dot{font-style:normal;margin:0 -.16em}
  .headline span+span{background:linear-gradient(180deg,#b7a2ff 0%,var(--blue) 50%,var(--blue-hi) 100%);
    -webkit-background-clip:text;background-clip:text}

  .copy{margin-bottom:28px}
  .quote{font-weight:800;font-size:40px;line-height:1.38;letter-spacing:-1px;
    background:linear-gradient(90deg,#ffffff 0%,var(--violet-hi) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .bullets{margin-top:14px;font-size:27px;font-weight:500;color:var(--ink-dim);line-height:1.6}
  body.insta .bullets{display:none}

  .boxes{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;margin-bottom:34px}
  .box{display:flex;flex-direction:column;background:var(--card);border:1.5px solid var(--card-line);border-radius:18px;
    padding:28px 34px 30px;backdrop-filter:blur(4px);box-shadow:inset 0 0 30px rgba(120,100,255,.12)}
  .tag{align-self:flex-start;font-weight:800;font-size:23px;padding:5px 20px;border-radius:999px;margin-bottom:10px;
    background:rgba(255,255,255,.1);border:1.5px solid rgba(200,185,255,.55)}
  /* 항목을 박스 높이에 고르게 나눠 배치 */
  .box ul{list-style:none;flex:1;display:flex;flex-direction:column;justify-content:space-evenly}
  .box li{font-size:27px;font-weight:700;line-height:1.3;display:flex;gap:16px;align-items:flex-start;letter-spacing:-.3px}
  .box li small{display:block;font-size:21px;font-weight:400;color:var(--ink-dim);margin-top:4px;letter-spacing:0}
  .box ul{margin-top:12px}
  .box li+li{margin-top:22px}
  .chk{flex:none;width:28px;height:28px;margin-top:3px;border:2.5px solid var(--violet-hi);border-radius:6px;position:relative}
  .chk::after{content:"";position:absolute;left:7px;top:1px;width:8px;height:15px;border:solid #fff;border-width:0 3.5px 3.5px 0;transform:rotate(45deg)}
  /* 수강 정보: 작은 항목명 + 큰 값, 사이에 구분선 */
  .info li{display:block}
  .info li+li{border-top:1px solid rgba(200,185,255,.22);padding-top:22px}
  .info .k{display:block;font-size:21px;font-weight:600;color:var(--ink-dim);margin-bottom:8px}
  .info .v{display:block;font-size:34px;font-weight:800;letter-spacing:-.5px}
  .blank{color:var(--violet-hi)}

  footer{position:absolute;left:0;right:0;bottom:0;z-index:3;height:122px;display:flex;align-items:center;justify-content:space-between;
    padding:0 72px;background:linear-gradient(90deg,#2a1f78,#1d2470);border-top:1.5px solid rgba(170,150,255,.5)}
  footer .lbl{font-size:30px;font-weight:700}
  footer .tel{font-size:62px;font-weight:900;letter-spacing:1px}
  .wrap{padding-bottom:122px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="streak" style="left:-80px;top:200px;width:330px;transform:rotate(-24deg)"></div>
<div class="streak" style="right:-80px;top:660px;width:330px;transform:rotate(-24deg);opacity:.6"></div>
<div class="star" style="left:120px;top:150px;width:5px;height:5px"></div>
<div class="star" style="left:930px;top:130px;width:4px;height:4px"></div>
<div class="star" style="left:990px;top:420px;width:6px;height:6px"></div>
<div class="star" style="left:70px;top:470px;width:4px;height:4px"></div>
<div class="star" style="left:880px;top:700px;width:4px;height:4px;opacity:.7"></div>
<div class="star" style="left:220px;top:760px;width:3px;height:3px;opacity:.7"></div>
<svg class="sparkle" style="left:840px;top:150px" viewBox="0 0 40 40"><path d="M20 0C21 13 27 19 40 20 27 21 21 27 20 40 19 27 13 21 0 20 13 19 19 13 20 0Z" fill="#e8eeff"/></svg>
<svg class="sparkle" style="left:150px;top:560px;width:28px;height:28px" viewBox="0 0 40 40"><path d="M20 0C21 13 27 19 40 20 27 21 21 27 20 40 19 27 13 21 0 20 13 19 19 13 20 0Z" fill="#cfdcff"/></svg>


<div class="wrap">
  <header>
    <img src="../../assets/logo/trimmed/tnb-logo-purple.png" alt="">
    <div class="name">T&amp;BEDU</div>
  </header>

  <section class="hero">
    <div class="title">
      <div class="halo">
        <div class="ring glow"></div><div class="ring r2"></div><div class="ring r1"></div><div class="ring r3"></div><div class="ring arc"></div>
      </div>
      <div class="eyebrow">2027 신학기 대비</div>
      <h1 class="headline"><span>초<i class="dot">·</i>중등부</span><span>대규모 개강</span></h1>
    </div>
  </section>

  <section class="copy">
    <p class="quote">“개념부터 오답까지,<br>공부의 흐름을 바로 잡아드립니다.”</p>
    <p class="bullets">- 학년·수준에 맞춘 반 편성으로 맞춤 수업<br>- 수업 → 연습 → 오답 점검까지 한 번에 관리</p>
  </section>

  <section class="boxes">
    <div class="box">
      <span class="tag">강좌 특징</span>
      <ul>
        <li><i class="chk"></i><div>개념 이해<small>핵심 개념부터 탄탄하게</small></div></li>
        <li><i class="chk"></i><div>유형 연습<small>배운 개념을 문제에 적용</small></div></li>
        <li><i class="chk"></i><div>오답 점검<small>틀린 이유를 짚고 다시 풀기</small></div></li>
      </ul>
    </div>
    <div class="box info">
      <span class="tag">수강 정보</span>
      <ul>
        <li><span class="k">개강일</span><span class="v blank">12월 1일 (화)</span></li>
        <li><span class="k">대상</span><span class="v">초등부 · 중등부</span></li>
      </ul>
    </div>
  </section>
</div>

<footer>
  <span class="lbl">전화 / 방문 상담 가능</span>
  <span class="tel">0507-1338-0838</span>
</footer>

<script>
  const size = new URLSearchParams(location.search).get('size') || 'insta';
  document.body.classList.add(size);
  if (size === 'a4') {
    document.documentElement.style.setProperty('--halo','720px');
    document.documentElement.style.setProperty('--h-size','160px');
  }
</script>
</body>
</html>
