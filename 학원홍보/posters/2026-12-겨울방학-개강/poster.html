<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>T&BEDU 겨울방학 대규모 개강</title>
<style>
  /* 문구는 <body> 안에서 바로 고치면 됩니다.
     크기: poster.html?size=insta (1080×1350) / ?size=a4 (1080×1528 → 렌더 시 2480×3509) */
  :root{
    --navy:#17306b; --navy-2:#2a4b93; --blue:#2f6bff; --sky:#59b8ff; --ice:#e9f5ff;
    --ink:#1b2a4e; --ink-dim:#5a6b8f; --line:rgba(80,140,230,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;overflow:hidden;position:relative;background:#eaf5ff;
    font-family:'Noto Sans KR','Malgun Gothic',sans-serif;color:var(--ink);
    -webkit-font-smoothing:antialiased;word-break:keep-all}
  body.a4{height:1528px}

  /* ── 하늘 ── */
  .sky{position:absolute;inset:0;z-index:0;
    background:
      radial-gradient(ellipse 70% 40% at 80% 8%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(ellipse 60% 35% at 15% 30%, rgba(255,255,255,.55), transparent 70%),
      linear-gradient(180deg,#a9d4ff 0%,#cfe7ff 38%,#ecf6ff 70%,#ffffff 100%)}
  .sun{position:absolute;right:120px;top:70px;width:260px;height:260px;border-radius:50%;z-index:0;
    background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,255,255,.4) 40%,transparent 70%)}

  /* ── 눈 쌓인 언덕·나무 (SVG) ── */
  .land{position:absolute;left:0;right:0;bottom:122px;height:var(--land-h,430px);z-index:1}
  .land svg{width:100%;height:100%;display:block}

  /* ── 내리는 눈 ── */
  .snow{position:absolute;inset:0;z-index:2;pointer-events:none}
  .flake{position:absolute;border-radius:50%;background:#fff;
    box-shadow:0 0 6px rgba(120,170,235,.55)}
  .crystal{position:absolute;filter:drop-shadow(0 0 6px rgba(110,160,230,.45))}

  /* ── 본문 ── */
  .wrap{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;padding:0 72px 122px}
  header{display:flex;align-items:center;gap:14px;padding-top:52px}
  header img{width:58px;height:58px}
  header .name{font-weight:800;font-size:34px;letter-spacing:.5px;color:var(--navy)}
  header .season{margin-left:auto;font-weight:700;font-size:22px;letter-spacing:6px;color:var(--navy-2);opacity:.8}

  .hero{text-align:center;margin-top:var(--hero-top,46px)}
  .eyebrow{display:inline-block;font-weight:800;font-size:30px;color:#fff;letter-spacing:-.3px;
    padding:8px 28px;border-radius:999px;background:linear-gradient(90deg,var(--navy-2),var(--blue));
    box-shadow:0 6px 18px rgba(47,107,255,.3)}
  .headline{font-weight:900;line-height:1.04;letter-spacing:-5px;margin-top:20px}
  .headline span{display:block;font-size:var(--h-size,146px)}
  .headline .l1{color:var(--navy);text-shadow:0 4px 0 #fff,0 10px 30px rgba(23,48,107,.18)}
  .headline .l2{background:linear-gradient(180deg,#3d7bff 0%,#2f6bff 45%,#47a8ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 #fff) drop-shadow(0 12px 24px rgba(47,107,255,.28))}
  .quote{margin-top:22px;font-weight:700;font-size:32px;letter-spacing:-.8px;color:var(--navy-2)}

  /* 개강 일정 카드 */
  .sched{margin-top:auto;margin-bottom:34px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .card{background:rgba(255,255,255,.86);border:2px solid rgba(255,255,255,.95);border-radius:24px;
    padding:26px 30px 28px;box-shadow:0 12px 36px rgba(40,90,170,.18),inset 0 0 0 1px var(--line);
    backdrop-filter:blur(6px)}
  .card .no{display:inline-block;font-weight:800;font-size:22px;color:#fff;background:var(--blue);
    padding:4px 16px;border-radius:999px}
  .card.second .no{background:var(--navy)}
  .card .date{font-weight:900;font-size:54px;letter-spacing:-2px;color:var(--navy);margin:14px 0 4px}
  .card .date small{font-size:30px;font-weight:800;letter-spacing:0;margin-left:6px;color:var(--navy-2)}
  .card .who{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .card .who span{font-weight:700;font-size:20px;color:var(--navy-2);background:var(--ice);
    border:1.5px solid var(--line);padding:4px 10px;border-radius:10px}

  /* 강좌 특징: 아이콘 카드 3개 + 단계 화살표 (크기는 --feat-* 로 인스타/A4 조절) */
  .feat{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:10px;margin-top:var(--feat-top,30px)}
  .step{height:var(--feat-h,252px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    background:rgba(255,255,255,.88);border:2px solid #fff;border-radius:26px;padding:0 14px;
    box-shadow:0 12px 30px rgba(40,90,170,.16),inset 0 0 0 1px var(--line)}
  .step .ico{width:var(--ico,64px);height:var(--ico,64px);border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(145deg,#4f8dff,#2f6bff);box-shadow:0 8px 18px rgba(47,107,255,.35)}
  .step:nth-child(5) .ico{background:linear-gradient(145deg,#2a4b93,#17306b);box-shadow:0 8px 18px rgba(23,48,107,.35)}
  .step .ico svg{width:52%;height:52%}
  .step .n{margin-top:14px;font-size:var(--n-size,17px);font-weight:800;letter-spacing:3px;color:var(--blue)}
  .step b{display:block;margin-top:2px;font-size:var(--t-size,33px);font-weight:900;letter-spacing:-1px;color:var(--navy)}
  .step small{display:block;margin-top:6px;font-size:var(--d-size,19px);font-weight:500;color:var(--ink-dim);line-height:1.35}
  .arrow{width:26px;height:26px;border-top:5px solid var(--sky);border-right:5px solid var(--sky);transform:rotate(45deg);
    margin:0 4px 0 -4px;border-radius:3px;filter:drop-shadow(0 2px 4px rgba(47,107,255,.25))}

  footer{position:absolute;left:0;right:0;bottom:0;z-index:5;height:122px;display:flex;align-items:center;justify-content:space-between;
    padding:0 72px;color:#fff;background:linear-gradient(90deg,var(--navy),#1f4fb8)}
  footer::before{content:"";position:absolute;left:0;right:0;top:-14px;height:16px;
    background:radial-gradient(14px 10px at 14px 16px,#fff 98%,transparent) 0 0/28px 16px repeat-x}
  footer .lbl{font-size:30px;font-weight:700}
  footer .tel{font-size:62px;font-weight:900;letter-spacing:1px}
</style>
</head>
<body>
<div class="sky"></div>
<div class="sun"></div>
<div class="land" id="land"></div>
<div class="snow" id="snow"></div>

<div class="wrap">
  <header>
    <img src="../../assets/logo/trimmed/tnb-logo-blue.png" alt="">
    <div class="name">T&amp;BEDU</div>
    <div class="season">WINTER 2026</div>
  </header>

  <section class="hero">
    <div class="eyebrow">초·중·고 전 학년</div>
    <h1 class="headline"><span class="l1">겨울방학</span><span class="l2">대규모 개강</span></h1>
    <p class="quote">개념부터 오답까지, 공부의 흐름을 바로 잡아드립니다.</p>
  </section>

  <section class="feat">
    <div class="step">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2.2h5c.1-1 .5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg></span>
      <span class="n">STEP 01</span><b>개념 이해</b><small>핵심 개념부터<br>탄탄하게</small>
    </div>
    <i class="arrow"></i>
    <div class="step">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M14 6l4 4"/></svg></span>
      <span class="n">STEP 02</span><b>유형 연습</b><small>배운 개념을<br>문제에 적용</small>
    </div>
    <i class="arrow"></i>
    <div class="step">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16.5 9"/></svg></span>
      <span class="n">STEP 03</span><b>오답 점검</b><small>틀린 이유를 짚고<br>다시 풀기</small>
    </div>
  </section>

  <section class="sched">
    <div class="card first">
      <span class="no">1차 개강</span>
      <div class="date">12월 1일<small>(화)</small></div>
      <div class="who"><span>초등부</span><span>예비중1</span><span>예비고1</span></div>
    </div>
    <div class="card second">
      <span class="no">2차 개강</span>
      <div class="date">12월 21일<small>(월)</small></div>
      <div class="who"><span>예비중2</span><span>예비중3</span><span>예비고2</span><span>예비고3</span></div>
    </div>
  </section>

</div>

<footer>
  <span class="lbl">전화 / 방문 상담 가능</span>
  <span class="tel">0507-1338-0838</span>
</footer>

<script>
  const size = new URLSearchParams(location.search).get('size') || 'insta';
  document.body.classList.add(size);
  const H = size === 'a4' ? 1528 : 1350;
  if (size === 'a4') {
    const r = document.documentElement.style;
    r.setProperty('--h-size','158px'); r.setProperty('--hero-top','90px'); r.setProperty('--land-h','520px');
    r.setProperty('--feat-h','330px'); r.setProperty('--feat-top','52px'); r.setProperty('--ico','100px');
    r.setProperty('--t-size','42px'); r.setProperty('--d-size','22px'); r.setProperty('--n-size','19px');
  }

  // 같은 결과가 매번 나오도록 고정 시드 난수
  let seed = 20261201;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;

  // ── 언덕과 눈 덮인 나무 ──
  const W = 1080, LH = size === 'a4' ? 520 : 430;
  const tree = (x, base, h, col) => {
    let s = '';
    for (let i = 0; i < 3; i++) {
      const top = base - h + i * h * 0.24, bot = top + h * 0.40;
      const ww = h * (0.40 + i * 0.17);
      s += `<path d="M${x} ${top} L${x + ww / 2} ${bot} L${x - ww / 2} ${bot}Z" fill="${col}"/>`;
      s += `<path d="M${x} ${top} L${x + ww * 0.2} ${top + (bot - top) * 0.42} Q${x} ${top + (bot - top) * 0.5} ${x - ww * 0.2} ${top + (bot - top) * 0.42}Z" fill="#fff"/>`;
      s += `<path d="M${x - ww / 2} ${bot} Q${x} ${bot - 10} ${x + ww / 2} ${bot} Q${x} ${bot + 6} ${x - ww / 2} ${bot}Z" fill="#fff" opacity=".95"/>`;
    }
    s += `<rect x="${x - 5}" y="${base - h * 0.2}" width="10" height="${h * 0.2}" fill="#7d8fb5"/>`;
    return s;
  };
  let svg = `<svg viewBox="0 0 ${W} ${LH}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6e9ff"/><stop offset="1" stop-color="#f4f9ff"/></linearGradient>
      <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3f0ff"/></linearGradient>
    </defs>
    <path d="M0 ${LH * .38} C ${W * .2} ${LH * .2}, ${W * .38} ${LH * .42}, ${W * .55} ${LH * .3} S ${W * .85} ${LH * .14}, ${W} ${LH * .28} L ${W} ${LH} L 0 ${LH}Z" fill="url(#h1)"/>`;
  // 뒤쪽 나무 (옅은 색)
  [[70, .40, 120], [150, .36, 90], [905, .22, 130], [990, .27, 100], [820, .25, 80]].forEach(([x, b, h]) => svg += tree(x, LH * b, h, '#9fc3ea'));
  svg += `<path d="M0 ${LH * .62} C ${W * .25} ${LH * .48}, ${W * .45} ${LH * .66}, ${W * .7} ${LH * .52} S ${W * .95} ${LH * .5}, ${W} ${LH * .56} L ${W} ${LH} L 0 ${LH}Z" fill="url(#h2)"/>`;
  // 앞쪽 나무 (진한 색)
  [[40, .70, 170], [125, .66, 130], [1010, .62, 180], [935, .60, 120]].forEach(([x, b, h]) => svg += tree(x, LH * b, h, '#5f8fc6'));
  svg += `<path d="M0 ${LH * .86} C ${W * .3} ${LH * .76}, ${W * .6} ${LH * .92}, ${W} ${LH * .8} L ${W} ${LH} L 0 ${LH}Z" fill="#ffffff"/></svg>`;
  document.getElementById('land').innerHTML = svg;

  // ── 내리는 눈 ──
  const snow = document.getElementById('snow');
  let html = '';
  for (let i = 0; i < 170; i++) {
    const r = rnd(), s = r < .7 ? 3 + rnd() * 5 : r < .93 ? 8 + rnd() * 6 : 16 + rnd() * 14;
    const blur = s > 15 ? `filter:blur(${(s / 7).toFixed(1)}px);opacity:.8;` : `opacity:${(.65 + rnd() * .35).toFixed(2)};`;
    html += `<i class="flake" style="left:${(rnd() * W).toFixed(0)}px;top:${(rnd() * (H - 140)).toFixed(0)}px;width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;${blur}"></i>`;
  }
  const cr = (x, y, s, rot, op) => `<svg class="crystal" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;opacity:${op};transform:rotate(${rot}deg)" viewBox="-50 -50 100 100">
    <g stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none">${[0, 60, 120].map(a => `<g transform="rotate(${a})"><line x1="0" y1="-44" x2="0" y2="44"/><path d="M-12 -30 L0 -20 L12 -30 M-12 30 L0 20 L12 30"/></g>`).join('')}</g></svg>`;
  html += cr(110, 210, 64, 10, .95) + cr(930, 330, 52, 25, .9) + cr(60, 640, 40, 0, .85) + cr(990, 120, 36, 15, .85) + cr(560, 150, 30, 5, .7);
  snow.innerHTML = html;
</script>
</body>
</html>
